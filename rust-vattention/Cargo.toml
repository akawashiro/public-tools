[package]
name = "rust-vattention"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CUDA Llama inference with virtually contiguous, dynamically mapped KV caches"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"
half = "2"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
safetensors = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tokio-stream = "0.1"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-12060"] }

[profile.release]
lto = "thin"
codegen-units = 1
